<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>American Fashion × Meegle — Master Plan</title>
<link rel="stylesheet" href="assets/tokens.css" />
<link rel="stylesheet" href="assets/plan.css" />
<link rel="stylesheet" href="assets/app.css" />
<link rel="stylesheet" href="assets/drawer.css" />
<link rel="stylesheet" href="assets/charts.css" />
<template id="__bundler_thumbnail">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<rect width="100" height="100" fill="#1A1A1A"/>
<g transform="translate(26,26)">
<rect x="0" y="0" width="48" height="48" rx="5" fill="#fff"/>
<rect x="0" y="0" width="48" height="12" rx="5" fill="#8051FF"/>
<rect x="6" y="20" width="14" height="6" rx="2" fill="#1A1A1A"/>
<rect x="24" y="20" width="18" height="6" rx="2" fill="#D4D4D4"/>
<rect x="6" y="31" width="36" height="4" rx="2" fill="#E3E3E3"/>
<rect x="6" y="39" width="26" height="4" rx="2" fill="#E3E3E3"/>
</g>
</svg>
</template>
</head>
<body>
<div class="scaffold"></div>

<header class="appbar">
  <div class="appbar-top">
    <div class="logo">American&nbsp;Fashion <span class="x">×</span> Meegle</div>
    <div class="sub">Master Plan triển khai · Chuẩn hóa chuỗi giá trị &amp; SOP</div>
    <div class="spacer"></div>
    <div class="pill" id="tabCount">11 modules</div>
  </div>
  <nav class="tabbar" id="tabbar"></nav>
</header>

<main class="tabwrap" id="content">
  <div class="tab-loading">Đang tải…</div>
</main>

<script>
window.__BUILD = '4';
(function(){
  // Tab registry — order defines the bar
  var TABS = [
    { id: 'approach',     label: 'Approach' },
    { id: 'context',      label: 'Context' },
    { id: 'valuechain',   label: 'Value Chain' },
    { id: 'wit',          label: 'Work Item Types' },
    { id: 'relationship', label: 'Relationship' },
    { id: 'workflow',     label: 'Workflow' },
    { id: 'automation',   label: 'Automation' },
    { id: 'roles',        label: 'Roles & RACI' },
    { id: 'dashboard',    label: 'Dashboard' },
    { id: 'scenario',     label: 'Scenario' },
    { id: 'roadmap',      label: 'Roadmap' }
  ];
  var bar = document.getElementById('tabbar');
  var content = document.getElementById('content');
  var cache = {};

  TABS.forEach(function(t, i){
    var el = document.createElement('div');
    el.className = 'tab';
    el.dataset.id = t.id;
    el.innerHTML = '<span class="ti">' + String(i+1).padStart(2,'0') + '</span>' + t.label;
    el.addEventListener('click', function(){ go(t.id); });
    bar.appendChild(el);
  });

  function setActive(id){
    Array.prototype.forEach.call(bar.children, function(c){
      c.classList.toggle('active', c.dataset.id === id);
    });
    var at = bar.querySelector('.tab.active');
    if (at && at.scrollIntoView) {
      var r = at.getBoundingClientRect();
      if (r.left < 80 || r.right > window.innerWidth - 80) {
        at.scrollIntoView({ inline: 'center', block: 'nearest' });
      }
    }
  }

  function go(id){
    if (!TABS.some(function(t){ return t.id === id; })) id = TABS[0].id;
    if (location.hash !== '#' + id) { location.hash = id; return; } // hashchange will re-trigger
    setActive(id);
    render(id);
  }

  function render(id){
    if (cache[id]) { swap(cache[id]); return; }
    content.innerHTML = '<div class="tab-loading">Đang tải module…</div>';
    fetch('tabs/' + id + '.html?v=' + (window.__BUILD || '3'))
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
      .then(function(html){ cache[id] = html; swap(html); })
      .catch(function(e){
        content.innerHTML = '<div class="tab-loading">Không tải được module <code>' + id + '</code> (' + e.message + ').</div>';
      });
  }

  function swap(html){
    content.innerHTML = html;
    window.scrollTo(0, 0);
    // run any inline data-init handlers (filter chips etc.)
    content.querySelectorAll('[data-filter-group]').forEach(initFilter);
    content.querySelectorAll('[data-dvgroup]').forEach(initDashViews);
  }

  // dashboard view switcher: .dv-tab[data-dv] toggles [data-dvpanel]
  function initDashViews(group){
    var tabs = group.querySelectorAll('.dv-tab');
    var panels = content.querySelectorAll('[data-dvpanel]');
    tabs.forEach(function(t){
      t.addEventListener('click', function(){
        tabs.forEach(function(c){ c.classList.remove('active'); });
        t.classList.add('active');
        var id = t.getAttribute('data-dv');
        panels.forEach(function(p){ p.classList.toggle('active', p.getAttribute('data-dvpanel') === id); });
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
  }

  // generic chip filter: chips with data-filter set stage; cards with data-stage shown/hidden
  function initFilter(group){
    var chips = group.querySelectorAll('.chip-filter');
    var scope = group.getAttribute('data-filter-group');
    var targets = document.querySelectorAll('[data-filter-target="' + scope + '"] [data-stage]');
    chips.forEach(function(chip){
      chip.addEventListener('click', function(){
        chips.forEach(function(c){ c.classList.remove('active'); });
        chip.classList.add('active');
        var v = chip.getAttribute('data-filter');
        targets.forEach(function(t){
          t.style.display = (v === 'all' || t.getAttribute('data-stage') === v) ? '' : 'none';
        });
      });
    });
  }

  window.addEventListener('hashchange', function(){
    var id = location.hash.replace('#','') || TABS[0].id;
    setActive(id); render(id);
  });

  var start = location.hash.replace('#','') || TABS[0].id;
  setActive(start);
  render(start);

  // Dynamically inject data + drawer scripts in order (runtime injection bypasses
  // the static-HTML sanitizer that strips parsed <script src> tags).
  ['assets/data-wit-a.js','assets/data-wit-b.js','assets/data-misc.js','assets/drawer.js']
    .reduce(function(p, src){
      return p.then(function(){
        return new Promise(function(res){
          var s = document.createElement('script');
          s.src = src + '?v=' + (window.__BUILD || '2'); s.onload = res; s.onerror = res;
          document.body.appendChild(s);
        });
      });
    }, Promise.resolve());
})();
</script>
</body>
</html>
